<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 背景圆 -->
  <circle cx="100" cy="100" r="98" fill="#F5F0E8" stroke="#B8860B" stroke-width="3"/>
  <!-- 头部 -->
  <circle cx="100" cy="75" r="35" fill="#8B2500" opacity="0.12"/>
  <circle cx="100" cy="75" r="32" fill="none" stroke="#8B2500" stroke-width="1.5" opacity="0.4"/>
  <!-- 眼睛 -->
  <ellipse cx="88" cy="72" rx="5" ry="6" fill="#2C2C2C"/>
  <ellipse cx="112" cy="72" rx="5" ry="6" fill="#2C2C2C"/>
  <circle cx="90" cy="70" r="1.5" fill="white"/>
  <circle cx="114" cy="70" r="1.5" fill="white"/>
  <!-- 微笑 -->
  <path d="M90 84 Q100 94 110 84" fill="none" stroke="#2C2C2C" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 腮红 -->
  <ellipse cx="80" cy="80" rx="6" ry="4" fill="#C0392B" opacity="0.12"/>
  <ellipse cx="120" cy="80" rx="6" ry="4" fill="#C0392B" opacity="0.12"/>
  <!-- 身体 -->
  <ellipse cx="100" cy="140" rx="30" ry="25" fill="#8B2500" opacity="0.08"/>
  <ellipse cx="100" cy="140" rx="28" ry="23" fill="none" stroke="#8B2500" stroke-width="1" opacity="0.3"/>
  <!-- 问号装饰 -->
  <text x="142" y="48" font-size="22" fill="#B8860B" opacity="0.5">?</text>
  <!-- 文字 -->
  <text x="100" y="25" text-anchor="middle" font-size="14" font-family="serif" fill="#8B2500" letter-spacing="4">小清</text>
</svg>
