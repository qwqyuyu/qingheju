<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>养生社区 - 中医文化日常养生</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/discussion.css">
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav_logo">
            <img class="nav_logo_icon" src="/images/logo.png" alt="logo">
            <span class="nav_logo_text">清和居</span>
        </div>
        <button class="nav_toggle" aria-label="菜单">
            <span></span><span></span><span></span>
        </button>
        <div class="nav_links">
            <a href="home.html">首页</a>
            <a href="recipe.html">食谱养生</a>
            <a href="solarterms.html">节气养生</a>
            <a href="culture.html">中医文化</a>
            <a href="discussion.html" class="active">养生社区</a>
            <a href="checkin.html">每日签到</a>
            <a href="constitution.html">体质自测</a>
            <a href="login.html" id="nav_user_link">登录</a>
        </div>
    </nav>

    <main class="page_container">
        <!-- 面包屑 -->
        <div class="breadcrumb">
            <a href="home.html">首页</a><span>›</span><span>养生社区</span>
        </div>

        <!-- 页面标题 -->
        <h1 class="section_title">养生社区</h1>
        <div class="section_divider"></div>
        <p class="section_subtitle">分享养生心得，交流健康经验，共同守护身心健康</p>

        <!-- 发帖按钮 -->
        <div class="community_header">
            <button type="button" class="btn btn_primary" id="new_post_btn"><svg class="btn_icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>发布新帖</button>
        </div>

        <!-- 发帖对话框（隐藏） -->
        <section class="post_editor" id="post_editor" style="display:none;" aria-labelledby="editor_title">
            <h3 class="editor_title" id="editor_title">发布新帖</h3>
            <div class="form_group">
                <label for="post_title">标题</label>
                <input type="text" id="post_title" class="form_input" placeholder="请输入帖子标题" maxlength="100" aria-describedby="post_error">
            </div>
            <div class="form_group">
                <label for="post_content">内容</label>
                <textarea id="post_content" class="form_input post_textarea" placeholder="分享您的养生心得..." rows="6" aria-describedby="post_error"></textarea>
            </div>
            <div class="form_group">
                <label for="post_image">图片（可选，JPG/PNG/WebP/GIF，不超过 5MB）</label>
                <input type="file" id="post_image" accept=".jpg,.jpeg,.png,.webp,.gif,image/jpeg,image/png,image/webp,image/gif" class="form_input" aria-describedby="post_image_status post_image_error">
                <p class="image_selection_status" id="post_image_status" role="status" aria-live="polite"></p>
                <img id="post_image_preview" class="image_preview" style="display:none;" alt="已选图片预览">
                <button type="button" class="btn btn_outline remove_post_image" id="remove_post_image" hidden>移除图片</button>
                <span class="form_field_error" id="post_image_error" role="alert"></span>
            </div>
            <div class="editor_actions">
                <button type="button" class="btn btn_primary" id="submit_post">发 布</button>
                <button type="button" class="btn btn_outline" id="cancel_post">取 消</button>
            </div>
            <div class="form_field_error post_error" id="post_error" role="alert"></div>
        </section>

        <!-- 帖子列表 -->
        <div class="post_list" id="post_list">
            <!-- 由 JS 动态渲染加载、空、失败及帖子内容 -->
        </div>

        <!-- 分页加载 -->
        <div class="load_more_wrap" id="load_more_wrap" style="display:none;">
            <button type="button" class="btn btn_outline" id="load_more_btn">加载更多</button>
            <p class="load_more_hint" id="load_more_hint" role="status" aria-live="polite"></p>
        </div>
    </main>

    <!-- 帖子详情弹窗 -->
    <div class="modal_overlay" id="post_modal" aria-hidden="true">
        <div class="modal_post paper_dialog" role="dialog" aria-modal="true" aria-labelledby="modal_post_title" tabindex="-1">
            <button type="button" class="modal_close" id="modal_post_close" aria-label="关闭帖子详情">&times;</button>
            <div class="modal_post_content" id="modal_post_content">
                <!-- 正文与评论由 JS 分区域异步渲染 -->
            </div>
        </div>
    </div>

    <!-- 页脚 -->
    <footer class="footer">
        <p>清和居 © 2026 | 传承中医文化 · 弘扬养生之道</p>
    </footer>

    <script src="/js/common.js?v=20261030-p2"></script>
    <script src="/js/api.js?v=20261030-p2"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/discussion.js"></script>
</body>
</html>
