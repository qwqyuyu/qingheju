<body>

    <!-- ========== 导航栏 ========== -->
    <nav class="navbar">
        <div class="nav_logo">
            <img class="nav_logo_icon" src="/images/logo.png" alt="logo">

        <button class="nav_toggle" aria-label="菜单">

                    <div class="carousel_card" data-index="0">
                        <img src="/images/carousel/slide_1.jpg" alt="" class="carousel_img">

                    <div class="carousel_card" data-index="2">

                    <div class="carousel_card" data-index="3">

                <span class="indicator active" data-slide="0"></span>
                <span class="indicator" data-slide="1"></span>
                <span class="indicator" data-slide="2"></span>

                navUserLink.href = 'profile.html';
