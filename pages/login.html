<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 中医文化日常养生</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body class="auth_page">

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav_logo">
            <img class="nav_logo_icon" src="/images/logo.png" alt="logo">
            <span class="nav_logo_text">清和居</span>
        </div>
        <button class="nav_toggle" aria-label="菜单">
            <span></span><span></span><span></span>
        </button>
        <div class="nav_links">
            <a href="home.html">首页</a>
            <a href="recipe.html">食谱养生</a>
            <a href="solarterms.html">节气养生</a>
            <a href="culture.html">中医文化</a>
            <a href="discussion.html">养生社区</a>
            <a href="checkin.html">每日签到</a>
            <a href="constitution.html">体质自测</a>
            <a href="login.html" class="active">登录</a>
        </div>
    </nav>

    <!-- 登录表单区域 -->
    <main class="auth_container">
        <div class="auth_card">
            <h2 class="auth_title">欢迎回来</h2>
            <p class="auth_subtitle">登录您的账号，继续养生之旅</p>

            <form id="login_form" class="auth_form" novalidate>
                <div class="form_group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" class="form_input" placeholder="请输入用户名" autocomplete="username" aria-describedby="username_error" required>
                    <div class="form_field_error" id="username_error"></div>
                </div>
                <div class="form_group">
                    <label for="password">密码</label>
                    <input type="password" id="password" class="form_input" placeholder="请输入密码" autocomplete="current-password" aria-describedby="password_error" required>
                    <div class="form_field_error" id="password_error"></div>
                </div>
                <div class="form_error" id="login_error" role="alert" aria-live="assertive"></div>
                <button type="submit" class="btn btn_primary auth_btn" id="login_btn">登 录</button>
            </form>

            <p class="auth_switch">还没有账号？<a href="register.html">立即注册</a></p>
            <p class="auth_back"><a href="home.html">← 返回首页</a></p>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <p>清和居 © 2026 | 传承中医文化 · 弘扬养生之道</p>
    </footer>

    <script src="/js/common.js?v=20261030-p2"></script>
    <script src="/js/api.js?v=20261030-p2"></script>
    <script src="/js/ui.js"></script>
    <script>
        /* 登录成功后的落地页：只接受白名单格式的本地页面文件名，防开放跳转。 */
        function loginTarget() {
            try {
                const value = new URLSearchParams(window.location.search).get('redirect') || '';
                if (/^[a-z0-9_-]+\.html$/.test(value) && value !== 'login.html' && value !== 'register.html') {
                    return value;
                }
                return 'index.html';
            } catch (e) {
                return 'index.html';
            }
        }

        const loginForm = document.getElementById('login_form');
        const loginButton = document.getElementById('login_btn');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginError = document.getElementById('login_error');

        function setFieldError(input, message) {
            const error = document.getElementById(input.id + '_error');
            error.textContent = message || '';
            if (message) input.setAttribute('aria-invalid', 'true');
            else input.removeAttribute('aria-invalid');
        }

        [usernameInput, passwordInput].forEach(function (input) {
            input.addEventListener('input', function () {
                setFieldError(input, '');
                loginError.textContent = '';
            });
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (loginButton.classList.contains('is_busy')) return;

            const username = usernameInput.value.trim();
            /* 密码保留首尾空格，与注册和修改密码的规则一致。 */
            const password = passwordInput.value;
            setFieldError(usernameInput, '');
            setFieldError(passwordInput, '');
            loginError.textContent = '';

            if (!username || !password) {
                if (!username) setFieldError(usernameInput, '请输入用户名');
                if (!password) setFieldError(passwordInput, '请输入密码');
                (username ? passwordInput : usernameInput).focus();
                return;
            }

            await UI.run(loginButton, async function () {
                try {
                    const result = await API.login(username, password);
                    if (result && result.success) {
                        window.location.href = loginTarget();
                        return;
                    }
                    /* 服务端为避免账号枚举，将账号或密码错误合并返回，作为表单级错误展示。 */
                    loginError.textContent = (result && (result.message || result.msg)) || '登录失败，请稍后重试';
                } catch (err) {
                    loginError.textContent = '网络连接失败，请检查网络后重试';
                    UI.toast(loginError.textContent, 'error');
                }
            }, '登录中…');
        });

        /* 如果已登录，直接跳转 */
        if (API.getCurrentUser()) {
            window.location.href = loginTarget();
        }
    </script>
</body>
</html>
